<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="inputPrompt.title">Voice Input</title>
  <link rel="stylesheet" href="material-icons.css">
  <link rel="stylesheet" href="input-prompt.css">
</head>

<body>
  <div class="input-prompt" id="inputPrompt">
    <div class="left-section">
      <div class="microphone-icon material-icons">mic</div>
      <div class="content-section">
        <!-- Populated by updateShortcutHint() on init (both the get-settings
             success and failure paths). Hardcoded text here would flash the
             default shortcut in English before JS takes over — and it can be
             wrong twice: not the user's configured shortcut, not their locale. -->
        <div class="prompt-text" id="promptText"></div>
        <div class="status-text" id="statusText"></div>
        <div class="model-badge" id="modelBadge"></div>
      </div>
    </div>

    <div class="right-section">
      <div class="wave-container" id="waveContainer">
        <!-- Wave bars will be generated by JavaScript -->
      </div>
      <button class="copy-btn" id="copyBtn" type="button" hidden>
        <span class="material-icons">content_copy</span>
        <span class="copy-btn-label" id="copyBtnLabel">Copy</span>
      </button>
      <button class="copy-btn" id="localModelBtn" type="button" hidden></button>
      <!-- Translate on a local engine is the one path that sends audio off the
           device. Asked here, after the key is released and the clip exists,
           because the user's hands are on the shortcut while recording. -->
      <div class="consent-actions" id="consentActions" hidden>
        <button class="consent-btn consent-btn-secondary" id="consentDeclineBtn" type="button">
          <span id="consentDeclineLabel">Not now</span>
        </button>
        <button class="consent-btn consent-btn-primary" id="consentAcceptBtn" type="button">
          <span id="consentAcceptLabel">Upload &amp; translate</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Sibling of the prompt box, NOT a child: .input-prompt has overflow:hidden,
       which silently clipped this bubble (positioned below the box) for its
       entire life — the final-transcription preview was never actually visible. -->
  <div class="transcription-text" id="transcriptionText">
    <!-- Text lives in an inner scroller so the fade mask (applied when older
         lines are scrolled out above) fades only the text, not the bubble's
         own background/border. -->
    <div class="transcription-text-inner" id="transcriptionTextInner"></div>
  </div>

  <script src="ipc-bridge.js"></script>
  <script src="i18n.js"></script>
  <script src="microphone-access.js"></script>
  <script type="module" src="vad-decision.mjs"></script>
  <script type="module" src="chunk-decision.mjs"></script>
  <script src="vad-gate.js"></script>
  <script src="input-prompt.js"></script>
</body>
</html>
