[package]
name = "saytype"
version = "1.8.5"
description = "Voice input method software"
authors = ["Tao"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/hellotaotao/saytype"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "saytype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6.0"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rdev = "0.5"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.3", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
enigo = "0.3.0"

[target.'cfg(windows)'.dependencies]
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
