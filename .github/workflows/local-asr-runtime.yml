name: Build local ASR runtime

on:
  workflow_dispatch:

jobs:
  macos-arm64:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout SayType
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build patched llama runtime
        run: npm run build:llama-runtime:mac-arm64

      - name: Upload runtime and checksum metadata
        uses: actions/upload-artifact@v4
        with:
          name: llama-b9960-saytype-reset-v1-macos-arm64
          if-no-files-found: error
          path: artifacts/local-asr-runtime/*

  # windows-latest ships MSVC and CMake, so the build needs no toolchain setup.
  # CMake's default multi-config generator emits build/bin/Release, which
  # build-patched-llama.mjs already probes for.
  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout SayType
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # GGML_VULKAN=ON needs the Vulkan headers, vulkan-1.lib and glslc, none of
      # which ship on the runner. This deliberately tracks LunarG's "latest"
      # rather than a pinned version: the exact SDK has to be observed once
      # before it can be pinned, so the step prints what it installed and the
      # version belongs in this file as a follow-up.
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk-installer.exe"
          curl.exe -sSL -o $installer "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
          # No --root: the default layout is C:\VulkanSDK\<version>\, so the
          # directory name reports the version that needs pinning here later.
          # Forcing the root flattens that away and leaves the SDK's own
          # subfolders looking like version directories.
          & $installer --accept-licenses --default-answer --confirm-command install | Out-Null
          $sdk = Get-ChildItem C:\VulkanSDK -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+' } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "no versioned Vulkan SDK under C:\VulkanSDK" }
          $glslc = Join-Path $sdk.FullName "Bin\glslc.exe"
          if (-not (Test-Path $glslc)) { throw "glslc.exe missing at $glslc" }
          Write-Host "Installed Vulkan SDK: $($sdk.Name)  <- pin this version"
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$($sdk.FullName)"
          Add-Content $env:GITHUB_PATH "$($sdk.FullName)\Bin"
          & $glslc --version

      - name: Build patched llama runtime
        run: npm run build:llama-runtime:win-x64

      - name: Upload runtime and checksum metadata
        uses: actions/upload-artifact@v4
        with:
          name: llama-b9960-saytype-reset-v1-windows-x64
          if-no-files-found: error
          path: artifacts/local-asr-runtime/*
